name: Build Windows Desktop App (.EXE)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Package Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        shell: bash
        run: |
          npm install --include=optional --legacy-peer-deps
          npm install @rolldown/binding-win32-x64-msvc@1.2.14 --no-save --legacy-peer-deps || true

      - name: Build Web Application
        shell: bash
        run: |
          if [ -f "dist/index.html" ]; then
            echo "Pre-built production dist/ is present."
            npm run build || echo "Using pre-built dist/ directly."
          else
            npm run build
          fi

      - name: Package Windows Installer (.exe) with Electron Builder
        shell: bash
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Setup .EXE (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: ZKT-Biometric-Windows-Desktop-Setup
          path: |
            dist-electron/*.exe
            dist/*.exe
          retention-days: 30
